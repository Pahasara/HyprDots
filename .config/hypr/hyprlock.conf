# github.com/pahasara/HyprDots

# ──────────────────────────────────────────────────────────────
#                     PATHS, FONTS & PALETTE
# ──────────────────────────────────────────────────────────────
$wall = ~/Pictures/Assets/lockscreen.jpg
$pfp  = ~/Pictures/Assets/dp.png

# Fonts
$font      = JetBrains Mono Nerd Font Bold
$font_bold = JetBrains Mono Nerd Font Mono ExtraBold
$font_alt  = CaskaydiaMono Nerd Font Bold Italic

# Palette: cyan -> azure accents, light frosted glass with a bright rim
$c_cyan   = rgba(33C7FFEE)
$c_azure  = rgba(3D7BFFEE)
$c_text   = rgb(E6EEFA)
$c_dim    = rgb(B7CCE6)
$c_ink    = rgba(5, 14, 32, 0.55)
$c_glass_a  = rgba(190, 225, 255, 0.18)
$c_glass_b  = rgba(190, 225, 255, 0.16)
$c_edge_a = rgba(E3F8FF99)
$c_edge_b = rgba(33C7FFEE)

# Layout is tuned for a 1920x1080 screen. Positions are offsets from the
# screen center (y goes up), the bottom row is pinned to the corners.


# ──────────────────────────────────────────────────────────────
#                        GENERAL SETTINGS
# ──────────────────────────────────────────────────────────────
general {
    hide_cursor        = true
    ignore_empty_input = true     # Enter on an empty field does nothing
    text_trim          = true
    fractional_scaling = 2        # 0 off, 1 on, 2 auto
    fail_timeout       = 2000     # ms until the field resets after a failed attempt
    immediate_render   = false    # Set true if the background pops in late
}


# ──────────────────────────────────────────────────────────────
#                         AUTHENTICATION
# ──────────────────────────────────────────────────────────────
auth {
    pam {
        enabled = true
    }
    fingerprint {
        enabled = false           # true if fprintd is set up
    }
}


# ──────────────────────────────────────────────────────────────
#                           ANIMATIONS
# ──────────────────────────────────────────────────────────────
animations {
    enabled = true

    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = standard,  0.2, 0, 0, 1

    animation = fadeIn,           1, 3.5, md3_decel
    animation = fadeOut,          1, 2.5, md3_accel
    animation = inputFieldColors, 1, 2,   standard
    animation = inputFieldFade,   1, 3,   standard
    animation = inputFieldWidth,  1, 4,   md3_decel
    animation = inputFieldDots,   1, 2,   md3_decel
}


# ──────────────────────────────────────────────────────────────
#                           BACKGROUND
# ──────────────────────────────────────────────────────────────
background {
    monitor           =
    path              = $wall       # or: screenshot (blurred copy of your desktop)
    color             = rgba(3, 10, 24, 1.0)
    blur_passes       = 3
    blur_size         = 2
    noise             = 0.0117
    contrast          = 1.4
    brightness        = 0.72
    vibrancy          = 0.30
    vibrancy_darkness = 0.10
}

# Light blue-black tint over the wallpaper for readability
shape {
    monitor  =
    size     = 100%, 100%
    color    = rgba(3, 10, 24, 0.22)
    rounding = 0
    position = 0, 0
    halign   = center
    valign   = center
    zindex   = 1
}


# ──────────────────────────────────────────────────────────────
#                          TIME & DATE
# ──────────────────────────────────────────────────────────────
label {
    monitor       =
    text          = cmd[update:1000] echo "$(date +'%H:%M')"
    color         = $c_text
    font_size     = 150
    font_family   = $font_bold
    shadow_passes = 4
    shadow_size   = 2
    shadow_color  = rgba(0, 20, 50, 0.8)
    position      = 0, 345
    halign        = center
    valign        = center
    zindex        = 3
}

# Date (Japanese locale)
label {
    monitor       =
    text          = cmd[update:60000] LANG=ja_JP.UTF-8 date '+%m月%d日  ·  %A'
    color         = rgb(33C7FF)
    font_size     = 28
    font_family   = $font_alt
    shadow_passes = 2
    shadow_size   = 3
    position      = 0, 245
    halign        = center
    valign        = center
    zindex        = 3
}

# Small accent divider
shape {
    monitor  =
    size     = 56, 3
    color    = $c_cyan
    rounding = -1
    position = 0, 200
    halign   = center
    valign   = center
    zindex   = 3
}


# ──────────────────────────────────────────────────────────────
#                              USER
# ──────────────────────────────────────────────────────────────
image {
    monitor       =
    path          = $pfp
    size          = 175
    rounding      = -1
    border_size   = 9
    border_color  = rgba(E3F8FFAA) rgba(33C7FF55) 135deg
    shadow_passes = 3
    shadow_size   = 2
    shadow_color  = rgba(0, 153, 204, 0.60)
    position      = 0, -40
    halign        = center
    valign        = center
    zindex        = 3
}

# Lock badge on the avatar
shape {
    monitor      =
    size         = 40, 40
    color        = rgba(5, 14, 32, 0.95)
    rounding     = -1
    border_size  = 2
    border_color = $c_edge_a $c_cyan 135deg
    position     = 68, -108
    halign       = center
    valign       = center
    zindex       = 4
}

label {
    monitor     =
    text        = 
    color       = rgb(33C7FF)
    font_size   = 17
    font_family = $font_bold
    position    = 68, -108
    halign      = center
    valign      = center
    zindex      = 5
}

label {
    monitor       =
    text          = $USER
    color         = $c_text
    font_size     = 26
    font_family   = $font_bold
    shadow_passes = 3
    shadow_size   = 3
    position      = 0, -200
    halign        = center
    valign        = center
    zindex        = 3
}

label {
    monitor       =
    text          = あなたを殺してもいいですか..?
    color         = rgb(33C7FF)
    font_size     = 12
    font_family   = $font_alt
    shadow_passes = 2
    shadow_size   = 3
    position      = 0, -238
    halign        = center
    valign        = center
    zindex        = 3
}


# ──────────────────────────────────────────────────────────────
#                         PASSWORD FIELD
# ──────────────────────────────────────────────────────────────
input-field {
    monitor           =
    size              = 260, 46
    outline_thickness = 2
    dots_size         = 0.30          # Relative to field height (0.2 - 0.8)
    dots_spacing      = 0.35
    dots_center       = true
    dots_rounding     = -1
    rounding          = -1
    outer_color       = rgba(E3F8FFCC) $c_cyan $c_azure 135deg
    inner_color       = $c_glass_a
    font_color        = $c_text
    font_family       = $font_bold
    fade_on_empty     = false
    placeholder_text  = <span foreground="##B7CCE6">  Password</span>
    check_color       = rgba(99E6FFEE) rgba(66AAFFEE) 120deg
    check_text        = <span foreground="##99E6FF">Verifying...</span>
    fail_color        = rgba(FF5C7AEE) rgba(FF2E63EE) 40deg
    fail_text         = <span foreground="##FF8FA3">$FAIL ($ATTEMPTS)</span>
    capslock_color    = rgba(CFF4FFEE) rgba(99D6FFEE) 45deg
    shadow_passes     = 2
    shadow_size       = 6
    shadow_color      = rgba(0, 120, 200, 0.55)
    position          = 0, -296
    halign            = center
    valign            = center
    zindex            = 3
}


# ──────────────────────────────────────────────────────────────
#                             QUOTE
# ──────────────────────────────────────────────────────────────
label {
    monitor       =
    text = cmd[update:2000] echo "<span letter_spacing='4000'>$(printf '%s\n' 'Past midnight. Do not look behind you.' 'You survived the night. Barely.' 'Something moved in the shadows.' 'It is dark. It knows you are here.' | sed -n "$(( ($(date +%-H)>=5) + ($(date +%-H)>=12) + ($(date +%-H)>=18) + 1 ))p")</span>"
    color         = $c_dim
    font_size     = 16
    font_family   = $font_alt
    shadow_passes = 2
    shadow_size   = 3
    position      = 0, -366
    halign        = center
    valign        = center
    zindex        = 3
}


# ──────────────────────────────────────────────────────────────
#                             STATUS
# ──────────────────────────────────────────────────────────────
# Thin full-width glass pill along the bottom edge
shape {
    monitor       =
    size          = 96%, 38
    color         = $c_glass_b
    rounding      = -1
    border_size   = 2
    border_color  = $c_edge_a $c_edge_b 135deg
    shadow_passes = 3
    shadow_size   = 8
    shadow_color  = rgba(0, 10, 30, 0.6)
    position      = 0, 12
    halign        = center
    valign        = bottom
    zindex        = 2
}

# Music (left)
label {
    monitor     =
    text        = cmd[update:1000] echo "$(~/.local/bin/media-info max_length=32 --no-browser --show-paused --fallback)"
    color       = $c_text
    font_size   = 15
    font_family = $font_alt
    position    = 64, 20
    halign      = left
    valign      = bottom
    zindex      = 3
}

# Location (center)
label {
    monitor     =
    text        = cmd[update:30000] echo "$(~/.local/bin/lock-location)"
    color       = $c_dim
    font_size   = 15
    font_family = $font
    position    = 0, 20
    halign      = center
    valign      = bottom
    zindex      = 3
}

# Battery (right)
label {
    monitor     =
    text        = cmd[update:1000] echo "$(~/.local/bin/battery-info)"
    color       = $c_text
    font_size   = 15
    font_family = $font_bold
    position    = -64, 20
    halign      = right
    valign      = bottom
    zindex      = 3
}
