# github.com/pahasara/HyprDots

# ──────────────────────────────────────────────────────────────
#                     PATHS, FONTS & PALETTE
# ──────────────────────────────────────────────────────────────
$wall = ~/Pictures/Assets/lockscreen.jpg   # lockscreen wallpaper
$pfp  = ~/Pictures/Assets/dp.png           # profile picture

# Fonts
$font      = JetBrainsMono NF              # main font
$font_bold = JetBrainsMono NF Mono         # same family, labels add ultrabold via markup
$font_alt  = CaskaydiaMono NF              # alt font, labels add bold italic via markup

# Palette: cyan -> azure accents, light frosted glass with a bright rim
$c_cyan    = rgba(33C7FFEE)                # main accent
$c_azure   = rgba(3D7BFFEE)                # second gradient accent
$c_text    = rgb(E6EEFA)                   # primary text
$c_dim     = rgb(B7CCE6)                   # secondary text
$c_ink     = rgba(5, 14, 32, 0.55)         # dark ink (currently unused)
$c_glass_a = rgba(190, 225, 255, 0.18)     # input field glass
$c_glass_b = rgba(190, 225, 255, 0.16)     # status bar glass
$c_edge_a  = rgba(E3F8FF99)                # bright rim start
$c_edge_b  = rgba(33C7FFEE)                # bright rim end

# Layout is tuned for a 1920x1080 screen. Positions are offsets from the
# screen center (y goes up), the bottom row is pinned to the corners.


# ──────────────────────────────────────────────────────────────
#                        GENERAL SETTINGS
# ──────────────────────────────────────────────────────────────
general {
    hide_cursor        = true     # hide the mouse cursor on the lockscreen
    ignore_empty_input = true     # Enter on an empty field does nothing
    text_trim          = true     # trim whitespace in label text
    fractional_scaling = 2        # 0 off, 1 on, 2 auto
    fail_timeout       = 2000     # ms until the field resets after a failed attempt
    immediate_render   = false    # Set true if the background pops in late
}


# ──────────────────────────────────────────────────────────────
#                         AUTHENTICATION
# ──────────────────────────────────────────────────────────────
auth {
    pam {
        enabled = true            # password auth through PAM
    }
    fingerprint {
        enabled = false           # true if fprintd is set up
    }
}


# ──────────────────────────────────────────────────────────────
#                           ANIMATIONS
# ──────────────────────────────────────────────────────────────
animations {
    enabled = true                # master switch for all animations

    bezier = md3_decel, 0.05, 0.7, 0.1, 1   # fast start, soft landing
    bezier = md3_accel, 0.3, 0, 0.8, 0.15   # slow start, fast exit
    bezier = standard,  0.2, 0, 0, 1        # general purpose curve

    animation = fadeIn,           1, 3.5, md3_decel   # lockscreen appears
    animation = fadeOut,          1, 2.5, md3_accel   # lockscreen disappears
    animation = inputFieldColors, 1, 2,   standard    # field color changes
    animation = inputFieldFade,   1, 3,   standard    # field fade in/out
    animation = inputFieldWidth,  1, 4,   md3_decel   # field width changes
    animation = inputFieldDots,   1, 2,   md3_decel   # dots appearing
}


# ──────────────────────────────────────────────────────────────
#                           BACKGROUND
# ──────────────────────────────────────────────────────────────
background {
    monitor           =                 # empty = all monitors
    path              = $wall           # or: screenshot (blurred copy of your desktop)
    color             = rgba(3, 10, 24, 1.0)   # fallback color while the image loads
    blur_passes       = 3                # more passes = smoother blur
    blur_size         = 2                # blur radius
    noise             = 0.0117           # film grain amount
    contrast          = 1.4              # image contrast
    brightness        = 0.72             # image brightness (<1 darkens)
    vibrancy          = 0.30             # color vibrancy
    vibrancy_darkness = 0.10             # vibrancy applied to dark areas
}

# Light blue-black tint over the wallpaper for readability
shape {
    monitor  =
    size     = 100%, 100%                # cover the whole screen
    color    = rgba(3, 10, 24, 0.22)     # tint color + opacity
    rounding = 0                         # square corners
    position = 0, 0
    halign   = center
    valign   = center
    zindex   = 1                         # above background, below widgets
}


# ──────────────────────────────────────────────────────────────
#                          TIME & DATE
# ──────────────────────────────────────────────────────────────
# Clock (ultrabold)
label {
    monitor       =
    text          = cmd[update:1000] echo "<span font_weight='ultrabold'>$(date +'%H:%M')</span>"   # refreshes every 1s
    color         = $c_text
    font_size     = 150
    font_family   = $font_bold
    shadow_passes = 4                    # shadow blur passes
    shadow_size   = 2                    # shadow spread
    shadow_color  = rgba(0, 20, 50, 0.8)
    position      = 0, 345
    halign        = center
    valign        = center
    zindex        = 3
}

# Date (Japanese locale, bold italic)
label {
    monitor       =
    text          = cmd[update:60000] echo "<span font_weight='bold' font_style='italic'>$(LANG=ja_JP.UTF-8 date '+%m月%d日  ·  %A')</span>"   # refreshes every 60s
    color         = rgb(33C7FF)
    font_size     = 28
    font_family   = $font_alt
    shadow_passes = 2
    shadow_size   = 3
    position      = 0, 245
    halign        = center
    valign        = center
    zindex        = 3
}

# Small accent divider
shape {
    monitor  =
    size     = 56, 3                     # short thin bar
    color    = $c_cyan
    rounding = -1                        # fully rounded ends
    position = 0, 200
    halign   = center
    valign   = center
    zindex   = 3
}


# ──────────────────────────────────────────────────────────────
#                              USER
# ──────────────────────────────────────────────────────────────
# Profile picture
image {
    monitor       =
    path          = $pfp
    size          = 175                  # width/height in px
    rounding      = -1                   # -1 = circle
    border_size   = 9
    border_color  = rgba(E3F8FFAA) rgba(33C7FF55) 135deg   # gradient border
    shadow_passes = 3
    shadow_size   = 2
    shadow_color  = rgba(0, 153, 204, 0.60)
    position      = 0, -40
    halign        = center
    valign        = center
    zindex        = 3
}

# Lock badge on the avatar
shape {
    monitor      =
    size         = 40, 40
    color        = rgba(5, 14, 32, 0.95)
    rounding     = -1                    # circle
    border_size  = 2
    border_color = $c_edge_a $c_cyan 135deg
    position     = 68, -108              # bottom-right of the avatar
    halign       = center
    valign       = center
    zindex       = 4
}

# Lock glyph (Nerd Font icon, U+F023) inside the badge
label {
    monitor     =
    text        = 
    color       = rgb(33C7FF)
    font_size   = 17
    font_family = $font_bold
    position    = 68, -108               # same spot as the badge
    halign      = center
    valign      = center
    zindex      = 5                      # above the badge
}

# Username (ultrabold)
label {
    monitor       =
    text          = <span font_weight='ultrabold'>$USER</span>
    color         = $c_text
    font_size     = 26
    font_family   = $font_bold
    shadow_passes = 3
    shadow_size   = 3
    position      = 0, -200
    halign        = center
    valign        = center
    zindex        = 3
}

# Tagline (bold italic)
label {
    monitor       =
    text          = <span font_weight='bold' font_style='italic'>あなたを殺してもいいですか..?</span>
    color         = rgb(33C7FF)
    font_size     = 12
    font_family   = $font_alt
    shadow_passes = 2
    shadow_size   = 3
    position      = 0, -238
    halign        = center
    valign        = center
    zindex        = 3
}


# ──────────────────────────────────────────────────────────────
#                         PASSWORD FIELD
# ──────────────────────────────────────────────────────────────
input-field {
    monitor           =
    size              = 260, 46          # width, height
    outline_thickness = 2                # border thickness
    dots_size         = 0.30             # Relative to field height (0.2 - 0.8)
    dots_spacing      = 0.35             # gap between dots
    dots_center       = true             # center the dots
    dots_rounding     = -1               # round dots
    rounding          = -1               # pill-shaped field
    outer_color       = rgba(E3F8FFCC) $c_cyan $c_azure 135deg   # gradient border
    inner_color       = $c_glass_a       # field fill
    font_color        = $c_text          # typed text color
    font_family       = $font_bold
    fade_on_empty     = false            # keep the field visible when empty
    placeholder_text  = <span foreground="##B7CCE6" font_weight="ultrabold">  Password</span>      # idle hint
    check_color       = rgba(99E6FFEE) rgba(66AAFFEE) 120deg      # border while verifying
    check_text        = <span foreground="##99E6FF" font_weight="ultrabold">Verifying...</span>    # shown while verifying
    fail_color        = rgba(FF5C7AEE) rgba(FF2E63EE) 40deg       # border on failure
    fail_text         = <span foreground="##FF8FA3" font_weight="ultrabold">$FAIL ($ATTEMPTS)</span>   # failure message
    capslock_color    = rgba(CFF4FFEE) rgba(99D6FFEE) 45deg      # border when Caps Lock is on
    shadow_passes     = 2
    shadow_size       = 6
    shadow_color      = rgba(0, 120, 200, 0.55)
    position          = 0, -296
    halign            = center
    valign            = center
    zindex            = 3
}


# ──────────────────────────────────────────────────────────────
#                             QUOTE
# ──────────────────────────────────────────────────────────────
# One of 4 lines picked by time of day: 05-11, 12-17, 18-23, 00-04 (bold italic)
label {
    monitor       =
    text = cmd[update:2000] echo "<span font_weight='bold' font_style='italic' letter_spacing='4000'>$(printf '%s\n' 'Past midnight. Do not look behind you.' 'You survived the night. Barely.' 'Something moved in the shadows.' 'It is dark. It knows you are here.' | sed -n "$(( ($(date +%-H)>=5) + ($(date +%-H)>=12) + ($(date +%-H)>=18) + 1 ))p")</span>"
    color         = $c_dim
    font_size     = 16
    font_family   = $font_alt
    shadow_passes = 2
    shadow_size   = 3
    position      = 0, -366
    halign        = center
    valign        = center
    zindex        = 3
}


# ──────────────────────────────────────────────────────────────
#                             STATUS
# ──────────────────────────────────────────────────────────────
# Thin full-width glass pill along the bottom edge
shape {
    monitor       =
    size          = 96%, 38              # almost full width
    color         = $c_glass_b
    rounding      = -1                   # pill ends
    border_size   = 2
    border_color  = $c_edge_a $c_edge_b 135deg
    shadow_passes = 3
    shadow_size   = 8
    shadow_color  = rgba(0, 10, 30, 0.6)
    position      = 0, 12                # 12px above the bottom edge
    halign        = center
    valign        = bottom
    zindex        = 2                    # behind the status labels
}

# Music (left, bold italic)
label {
    monitor     =
    text        = cmd[update:1000] echo "<span font_weight='bold' font_style='italic'>$(~/.local/bin/media-info max_length=32 --no-browser --show-paused --fallback)</span>"
    color       = $c_text
    font_size   = 15
    font_family = $font_alt
    position    = 64, 20
    halign      = left
    valign      = bottom
    zindex      = 3
}

# Location (center, bold)
label {
    monitor     =
    text        = cmd[update:30000] echo "<span font_weight='bold'>$(~/.local/bin/lock-location)</span>"   # refreshes every 30s
    color       = $c_dim
    font_size   = 15
    font_family = $font
    position    = 0, 20
    halign      = center
    valign      = bottom
    zindex      = 3
}

# Battery (right, ultrabold)
label {
    monitor     =
    text        = cmd[update:1000] echo "<span font_weight='ultrabold'>$(~/.local/bin/battery-info)</span>"
    color       = $c_text
    font_size   = 15
    font_family = $font_bold
    position    = -64, 20
    halign      = right
    valign      = bottom
    zindex      = 3
}
