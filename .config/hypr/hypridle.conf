# github.com/pahasara/HyprDots

# ──────────────────────────────────────────────────────────────
#                        GENERAL SETTINGS
# ──────────────────────────────────────────────────────────────
general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && systemctl --user restart audio-daemon

    inhibit_sleep    = 3     # Wait until hyprlock is really drawn before sleeping (no unlocked frame on resume)
}


# ──────────────────────────────────────────────────────────────
#                       KEYBOARD BACKLIGHT
# ──────────────────────────────────────────────────────────────
listener {
    timeout        = 10
    on-timeout     = brightnessctl -sd asus::kbd_backlight set 0
    on-resume      = brightnessctl -rd asus::kbd_backlight
    ignore_inhibit = true
    condition_cmd  = brightnessctl -d asus::kbd_backlight info > /dev/null 2>&1
}


# ──────────────────────────────────────────────────────────────
#                              DIM
# ──────────────────────────────────────────────────────────────
listener {
    timeout       = 240
    on-timeout    = brightnessctl -e4 -s set 55%
    on-resume     = brightnessctl -r
    condition_cmd = [ "$(brightnessctl -m | cut -d, -f4 | tr -d %)" -gt 55 ]
}


# ──────────────────────────────────────────────────────────────
#                              LOCK
# ──────────────────────────────────────────────────────────────
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}


# ──────────────────────────────────────────────────────────────
#                           SCREEN OFF
# ──────────────────────────────────────────────────────────────
listener {
    timeout    = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}


# ──────────────────────────────────────────────────────────────
#                    SUSPEND, THEN HIBERNATE
# ──────────────────────────────────────────────────────────────
# condition_retry re-checks while idle, so unplugging later still triggers it
listener {
    timeout         = 600
    on-timeout      = systemctl suspend-then-hibernate
    condition_cmd   = ! grep -qs 1 /sys/class/power_supply/A*/online
    condition_retry = 60
}

# On AC: suspend after 30 min
listener {
    timeout         = 1800
    on-timeout      = systemctl suspend-then-hibernate
    condition_cmd   = grep -qs 1 /sys/class/power_supply/A*/online
    condition_retry = 60
}

