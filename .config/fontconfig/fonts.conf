<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- User fontconfig: rendering tweaks + default font families --><fontconfig>
  <!-- Rendering settings, applied to every font -->
  <match target="font">
    <!-- Smooth glyph edges -->
    <edit mode="assign" name="antialias">
      <bool>true</bool>
    </edit>
    <!-- Enable hinting (snap glyphs to the pixel grid) -->
    <edit mode="assign" name="hinting">
      <bool>true</bool>
    </edit>
    <!-- Light hinting: vertical snapping only; try hintmedium/hintfull if still soft -->
    <edit mode="assign" name="hintstyle">
      <const>hintslight</const>
    </edit>
    <!-- Use the font's own hints, not FreeType's autohinter -->
    <edit mode="assign" name="autohint">
      <bool>false</bool>
    </edit>
    <!-- RGB subpixel antialiasing (the ClearType equivalent) -->
    <edit mode="assign" name="rgba">
      <const>rgb</const>
    </edit>
    <!-- Color-fringe filter -->
    <edit mode="assign" name="lcdfilter">
      <const>lcddefault</const>
    </edit>
  </match>
  <!-- ─── Serif Fonts ─────────────────────────────────────── -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Comic Sans MS</family>
      <family>Liberation Serif</family>
      <family>Times New Roman</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <!-- ─── Sans-Serif Fonts ────────────────────────────────── -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>Ubuntu Nerd Font</family>
      <family>Noto Sans</family>
      <family>Liberation Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <!-- ─── Monospace Fonts ─────────────────────────────────── -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMonoNL Nerd Font Mono</family>
      <family>CaskaydiaMono Nerd Font</family>
      <family>SF Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
