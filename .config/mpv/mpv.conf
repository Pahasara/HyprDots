# github.com/pahasara/HyprDots

# INFO: Optimized for Intel i7-1355U with Iris Xe Graphics (1080p SDR, 60 Hz).


##################
#     VIDEO      #
##################
profile=high-quality           # Built-in quality preset (EWA scalers, display-resample, interpolation)
vo=gpu-next                    # Modern libplacebo-based renderer
gpu-api=vulkan                 # Vulkan on Intel (ANV) is the best path for heavy shaders

# Decoding
hwdec=auto                     # Let mpv choose hardware decoding
hwdec-codecs=all               # Allow hardware decoding for every supported codec
hwdec-software-fallback=no     # Fall back to CPU decoding if hardware decoding fails

# Display & Sync
video-sync=display-resample    # Lock playback to the display refresh, avoids judder and drops
interpolation=yes              # Frame blending for smooth 24p on 60 Hz (set "no" to disable)
tscale=oversample              # Temporal interpolation method (cheap and very smooth)
dither-depth=auto              # Pick the dither bit depth from the display automatically

# HDR content on SDR screen
hdr-compute-peak=yes           # Measure per-scene brightness for better HDR to SDR tone mapping
tone-mapping=spline            # Tone mapping curve used for HDR to SDR conversion


##################
#    SCALING     #
##################
# Luma Upscaling (only matters when a neural shader is not handling the upscale)
scale=ewa_lanczossharp         # Top-tier luma upscaler (sharp, low ringing)
scale-antiring=0.8             # Reduce ringing artifacts on sharp edges
sigmoid-upscaling=yes          # Better light handling, less ringing when upscaling

# Luma Downscaling (4K to 1080p)
dscale=mitchell                # Clean downscaler, no ringing
dscale-antiring=0.7            # Moderate antiring for downscaling
correct-downscaling=yes        # Account for the scaling ratio, avoids aliasing
linear-downscaling=yes         # Downscale in linear light for correct brightness

# Chroma Scaling (Color)
cscale=ewa_lanczossharp        # Top-tier chroma upscaler
cscale-antiring=0.7            # Reduce color ringing artifacts

# Default Shaders (presets in input.conf replace it live)
# SSimSuperRes       = refines mpv's own upscale using SSIM, sharp edges with little ringing, very light
# KrigBilateral      = chroma reconstruction, sharper and more accurate color edges at any resolution
glsl-shaders="~~/shaders/SSimSuperRes.glsl:~~/shaders/KrigBilateral.glsl"


##################
#   DEBANDING    #
##################
deband=yes                     # Remove color banding in gradients (toggle with "y" in input.conf)
deband-iterations=4            # Number of debanding passes (higher = cleaner, more GPU)
deband-threshold=35            # Debanding strength (higher = removes more, may soften detail)
deband-range=16                # Pixel radius searched for banding
deband-grain=4                 # Light grain added to hide leftover banding


##################
#     AUDIO      #
##################
# Language & Volume
alang=jpn,jp,eng,en            # Preferred audio language order
volume=60                      # Start at 60% volume
volume-max=120                 # Allow volume boost up to 120%
volume-gain=5                  # Digital gain for quiet content

# Audio Quality
audio-device=auto              # Use the system default audio device
audio-exclusive=no             # Don't lock the sound card
audio-samplerate=48000         # Match the usual PipeWire sample rate
audio-pitch-correction=yes     # Keep the pitch normal when changing speed
audio-normalize-downmix=yes    # Normalize volume when downmixing surround to stereo

# Resampling
audio-resample-cutoff=0.98     # Preserve high frequencies when resampling
audio-resample-filter-size=32  # Resampler quality (higher = better, more CPU)

# Audio Filters
#af=lavfi=[loudnorm=I=-16:LRA=11:TP=-1.5]  # Balanced: safe for movies, anime and music
af=lavfi=[highpass=f=80,equalizer=f=250:t=q:w=1:g=-2,equalizer=f=3000:t=q:w=1.2:g=3,acompressor=threshold=0.089:ratio=3:attack=20:release=250,loudnorm=I=-16:LRA=7:TP=-1.5]  # Voice: clearer dialogue (cuts muddy lows, boosts speech clarity, tighter dynamics), not for music


##################
#   SUBTITLES    #
##################
# Auto-loading & Language
slang=eng,en,enUS              # Preferred subtitle languages
sub-auto=fuzzy                 # Load external subtitles with similar filenames
sub-pos=100                    # Vertical subtitle position in percent

# Subtitle Appearance
sub-font-size=48               # Readable font size
sub-bold=yes                   # Bold text
sub-blur=0.4                   # Slight blur for smoother edges
sub-border-size=3              # Outline width
sub-shadow-offset=0            # No shadow offset
sub-shadow-color='#000000EE'   # Semi-transparent black shadow


##################
#   PERFORMANCE  #
##################
# Cache Settings
cache=yes                      # Enable the RAM cache
cache-pause=no                 # Don't pause playback while the cache fills
demuxer-max-bytes=500M         # Max forward cache size
demuxer-max-back-bytes=100M    # Max backward cache size

# Decoder Threading
vd-lavc-threads=0              # Auto-detect the best CPU thread count
vd-lavc-dr=yes                 # Direct rendering, saves a memory copy

# Shader Cache
gpu-shader-cache-dir=~/.cache/shader_cache/mpv  # Keep compiled shaders so they load instantly next time


##################
#    GENERAL     #
##################
# Playback Behavior
save-position-on-quit=yes      # Resume from where you left off
keep-open=no                   # Close mpv when the file ends
cursor-autohide=500            # Hide the cursor after 500 ms

# Window Settings
geometry=60%x60%               # Start at 60% of the screen size
autofit-larger=50%x50%         # Never open larger than 50% of the screen

# OSD & Interface
osd-bar=no                     # Disable the volume/seek bar popup

