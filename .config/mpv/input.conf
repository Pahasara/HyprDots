# github.com/pahasara/HyprDots

#############
### VIDEO ###
#############
CTRL+h cycle-values hwdec vulkan vaapi auto-safe                # cycle the hardware decoder (for testing)
CTRL+g cycle-values gpu-api vulkan opengl auto                  # cycle the rendering API (for testing)

! add contrast -1                      # decrease contrast
@ add contrast 1                       # increase contrast
$ add brightness -1                    # decrease brightness
% add brightness 1                     # increase brightness
& add gamma -1                         # decrease gamma
* add gamma 1                          # increase gamma
( add saturation -1                    # decrease saturation
) add saturation 1                     # increase saturation

p add panscan -0.1                     # decrease panscan
P add panscan +0.1                     # shrink black bars by cropping the video
V cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1" # cycle the video aspect ratio ("-1" is the container aspect)
y cycle deband                         # toggle debanding on/off


############
### SEEK ###
############
h seek -2                              # seek back 2 seconds
l seek 2                               # seek forward 2 seconds
RIGHT seek 7                           # seek forward 7 seconds
LEFT seek -7                           # seek back 7 seconds
H seek -10                             # seek back 10 seconds
L seek 10                              # seek forward 10 seconds
SHIFT+RIGHT seek 20                    # seek forward 20 seconds
SHIFT+LEFT seek -20                    # seek back 20 seconds


##############
### VOLUME ###
##############
K add volume 2                         # volume up 2
J add volume -2                        # volume down 2
k add volume 5                         # volume up 5
j add volume -5                        # volume down 5
AXIS_UP add volume 5                   # mouse wheel up, volume up 5
AXIS_DOWN add volume -5                # mouse wheel down, volume down 5
UP add volume 10                       # volume up 10
DOWN add volume -10                    # volume down 10


###########
### SUB ###
###########
s cycle sub                            # switch subtitle track
S cycle sub down                       # switch subtitle track backwards
[ add sub-delay -0.1                   # shift subtitles 100 ms earlier
] add sub-delay +0.1                   # delay subtitles by 100 ms
r add sub-pos -1                       # move subtitles up
R add sub-pos +1                       # move subtitles down
CTRL+r set sub-pos 100; show-text "Subtitle position: 100%"  # reset subtitle position to the bottom
CTRL+s cycle-values sub-ass-override "force" "scale" # toggle overriding SSA/ASS subtitle styles with the normal styles


##############
### AUDIO ####
##############
a cycle audio                          # switch audio track
A cycle audio down                     # switch audio track backwards
CTRL+0 add audio-delay 0.100           # delay the audio by 100 ms
CTRL+9 add audio-delay -0.100          # play the audio 100 ms earlier
CTRL+1 no-osd change-list af set "lavfi=[loudnorm=I=-16:LRA=11:TP=-1.5]"; show-text "Audio: Balanced"  # leveling only, safe for everything (same as mpv.conf default)
CTRL+2 no-osd change-list af set "lavfi=[highpass=f=80,equalizer=f=250:t=q:w=1:g=-2,equalizer=f=3000:t=q:w=1.2:g=3,acompressor=threshold=0.089:ratio=3:attack=20:release=250,loudnorm=I=-16:LRA=7:TP=-1.5]"; show-text "Audio: Voice"  # clearer dialogue, not for music
CTRL+3 no-osd change-list af set "lavfi=[acompressor=threshold=0.05:ratio=6:attack=20:release=250,loudnorm=I=-18:LRA=5:TP=-2]"; show-text "Audio: Night"  # strong compression for late-night viewing
CTRL+4 no-osd change-list af clr ""; show-text "Audio filters cleared"  # original sound, no filters


############
### MISC ###
############
ENTER no-osd set fs-screen 1; cycle fullscreen # fullscreen on screen 1
f cycle fullscreen                     # toggle fullscreen
CTRL+j add chapter -1                  # seek to the previous chapter
CTRL+k add chapter 1                   # seek to the next chapter
W set pause yes; set window-minimized yes # pause and minimize the window
n cycle-values loop-file "inf" "no"    # toggle looping the current file


###############
### SHADERS ###
###############
# Presets REPLACE each other, only one is active at a time. Press 0 to clear everything.
# The preset in mpv.conf (SSimSuperRes + KrigBilateral) is active on startup and equals key 1.
1 no-osd change-list glsl-shaders set "~~/shaders/SSimSuperRes.glsl:~~/shaders/KrigBilateral.glsl"; show-text "Movies: SSimSuperRes + Krig"                                       # light and sharp, great on 480p/720p
2 no-osd change-list glsl-shaders set "~~/shaders/FSRCNNX_x2_8-0-4-1.glsl:~~/shaders/KrigBilateral.glsl"; show-text "Movies: FSRCNNX 8 + Krig"                                # neural upscale, heavier
3 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime: Anime4K Mode A (Fast)"                       # anime, restore + upscale (clean sources)
4 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime: Anime4K Mode B (Fast)"                  # anime, softer restore (blurry or low-quality sources)
5 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_L.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_L.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime: Anime4K Mode A (Medium)"  # anime, between Fast and HQ (L networks); step down to key 3 if it stutters
6 no-osd change-list glsl-shaders set "~~/shaders/KrigBilateral.glsl"; show-text "Chroma only (Krig)"  # lightest, for native 1080p sources or saving battery
0 no-osd change-list glsl-shaders clr ""; show-text "GLSL shaders cleared" # remove all shaders (use to compare against the raw picture)

